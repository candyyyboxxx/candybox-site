<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>candybox</title><style>
:root{--bg:#F6F3EE;--ink:#17120E;--body:#4A4640;--sub:#6F6A63;--card:#ECE8E2;--line:#D6D0C6;--amber:#B9770A}
@media (prefers-color-scheme:dark){:root{--bg:#17120E;--ink:#F6F3EE;--body:#D8D2C8;--sub:#9A9086;--card:#241D17;--line:#3C3936;--amber:#FFB21E}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
 font-size:16px;line-height:1.9;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:40px max(20px,env(safe-area-inset-left)) 96px}
h1{color:var(--ink);font-size:26px;line-height:1.4;margin:0 0 6px;letter-spacing:.01em}
h2{color:var(--ink);font-size:18px;line-height:1.5;margin:44px 0 10px;
 padding-top:18px;border-top:2.5px solid var(--line)}
h2:first-of-type{border-top:none;padding-top:0}
p{margin:0 0 14px}
ol,ul{margin:0 0 16px;padding-left:1.5em}
li{margin:0 0 7px}
strong{color:var(--ink);font-weight:700}
hr{border:none;border-top:2.5px solid var(--line);margin:34px 0}
table{width:100%;border-collapse:collapse;margin:0 0 18px;font-size:14.5px}
th,td{border:1.5px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
th{background:var(--card);color:var(--ink);font-weight:700}
blockquote{margin:22px 0;padding:16px 18px;background:var(--card);
 border-left:5px solid var(--amber);border-radius:0 12px 12px 0;font-size:14.5px}
blockquote p:last-child{margin:0}
.meta{color:var(--sub);font-size:14px;margin:0 0 28px}
a{color:var(--amber)}
.back{display:inline-block;margin-bottom:26px;font-size:14px;font-weight:700;text-decoration:none}
.home h2{border-top:none;padding-top:0}
.doclink{display:block;padding:18px 20px;margin:0 0 12px;background:var(--card);
 border:2.5px solid var(--ink);border-radius:16px;text-decoration:none;color:var(--ink);font-weight:700}
.doclink span{display:block;font-weight:400;font-size:14px;color:var(--sub);margin-top:4px}
</style></head>
<body><div class="wrap"><div class="home"><h1>candybox</h1>
<p class="meta">月に一度、ひらく。それだけのアプリです。</p>
<a class="doclink" href="./terms.html">利用規約<span>グループ・投稿・開くタイミング・禁止事項</span></a>
<a class="doclink" href="./privacy.html">プライバシーポリシー<span>何を集めて、何に使い、いつ消すのか</span></a>
<blockquote><p>氏名もメールアドレスも受け取りません。アドレス帳も位置情報も取得しません。</p></blockquote></div></div></body></html>
